name: Keep Last 10 Commits

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-history
  cancel-in-progress: false

jobs:
  trim-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep last 10 commits
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="${GITHUB_REF_NAME}"
          KEEP=10

          COUNT=$(git rev-list --count --first-parent HEAD)
          if [ "$COUNT" -le "$KEEP" ]; then
            echo "Only $COUNT commits, nothing to trim"
            exit 0
          fi

          # oldest commit to keep (10th newest)
          BASE=$(git rev-list --first-parent HEAD | sed -n "${KEEP}p")

          # new parentless root commit with BASE's snapshot
          ROOT=$(git commit-tree "$BASE^{tree}" -m "Trimmed history (snapshot of $BASE)")

          # replay the 9 newer commits onto the new root
          git rebase --onto "$ROOT" "$BASE" "$BRANCH"

          git push --force-with-lease origin "$BRANCH"
